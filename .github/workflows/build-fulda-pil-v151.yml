name: Fulda PIL v1.5.1 build

on:
  push:
    branches:
      - tmp-fulda-pil-v151-build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Prepare source
        shell: powershell
        run: |
          $b64 = @'
          
          '@
          $bytes = [Convert]::FromBase64String($b64)
          New-Item -ItemType Directory -Force -Path src, Build, out | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD 'src.tar.gz'), $bytes)
          tar -xzf src.tar.gz -C src

      - name: Compile
        shell: cmd
        run: |
          @echo on
          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if not exist "%CSC%" set "CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if not exist "%CSC%" exit /b 2
          "%CSC%" /nologo /target:library /langversion:5 /optimize+ /out:"Build\MelonLoader.dll" "src\MelonLoaderStub\MelonLoader.cs"
          if errorlevel 1 exit /b 3
          "%CSC%" /nologo /target:library /langversion:5 /optimize+ /reference:"Build\MelonLoader.dll" /out:"out\FuldaExpandedArsenal.dll" "src\Common\ArsenalCore.cs" "src\FuldaExpandedArsenal\Mod.cs"
          if errorlevel 1 exit /b 4
          "%CSC%" /nologo /target:library /langversion:5 /optimize+ /reference:"Build\MelonLoader.dll" /out:"out\PILExpandedArsenal.dll" "src\Common\ArsenalCore.cs" "src\PILExpandedArsenal\Mod.cs"
          if errorlevel 1 exit /b 5
          dir out

      - name: Hash outputs
        shell: powershell
        run: |
          Get-FileHash out\FuldaExpandedArsenal.dll -Algorithm SHA256
          Get-FileHash out\PILExpandedArsenal.dll -Algorithm SHA256

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: fulda-pil-v151-dlls
          path: out\*.dll
          if-no-files-found: error
