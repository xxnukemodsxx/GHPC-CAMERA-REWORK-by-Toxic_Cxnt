name: Build GHPC Live AAR v2.1

on:
  push:
    branches:
      - live-aar-v2-actually-final
    paths:
      - 'live-aar-v2/**'
      - '.github/workflows/build-live-aar-v21.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Apply v2.1 fixes
        shell: powershell
        run: |
          python live-aar-v2\v21_patch.py

      - name: Safety assertions
        shell: powershell
        run: |
          $src = (Get-Content live-aar-v2\LiveAarV2.cs -Raw) + (Get-Content live-aar-v2\BridgeV2.cs -Raw) + (Get-Content live-aar-v2\StageV2.cs -Raw)
          $forbidden = @(
            'StartAar(',
            'DisplayAarShot(',
            'Time.timeScale',
            'Physics.autoSimulation',
            'Camera.main',
            'Cursor.lockState',
            'Camera_Rework.'
          )
          foreach ($term in $forbidden) {
            if ($src.Contains($term)) { throw "Forbidden live-game takeover API found: $term" }
          }

      - name: Download MelonLoader 0.6.1
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://github.com/LavaGang/MelonLoader/releases/download/v0.6.1/MelonLoader.x64.zip' -OutFile ml.zip
          Expand-Archive ml.zip -DestinationPath ml -Force
          $melon = Get-ChildItem ml -Recurse -Filter MelonLoader.dll | Where-Object { $_.FullName -match '[\\/]net35[\\/]' } | Select-Object -First 1
          if (-not $melon) { $melon = Get-ChildItem ml -Recurse -Filter MelonLoader.dll | Select-Object -First 1 }
          if (-not $melon) { throw 'MelonLoader.dll not found.' }
          $melon.FullName | Set-Content melon-path.txt

      - name: Compile v2.1
        shell: powershell
        run: |
          $melon = (Get-Content melon-path.txt -Raw).Trim()
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw 'csc.exe not found.' }

          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:library /optimize+ /platform:anycpu /out:dist\GHPC_LiveAAR.dll /reference:"$melon" live-aar-v2\LiveAarV2.cs live-aar-v2\BridgeV2.cs live-aar-v2\StageV2.cs
          if ($LASTEXITCODE -ne 0) { throw "Compiler failed: $LASTEXITCODE" }

          $hash = (Get-FileHash dist\GHPC_LiveAAR.dll -Algorithm SHA256).Hash
          $size = (Get-Item dist\GHPC_LiveAAR.dll).Length
          "Version=2.1.0" | Set-Content dist\BUILD_INFO.txt
          "Fixes=black isolated backdrop, tighter robust camera fit, full native x-ray set, ammo/damage coloring, reduced spall clutter" | Add-Content dist\BUILD_INFO.txt
          "Architecture=isolated GHPC snapshot renderer; native AarVisual/AarModel + detached vehicle shell + baked skinned meshes + filtered shot family traces" | Add-Content dist\BUILD_INFO.txt
          "MelonLoaderCompileTarget=0.6.1 net35" | Add-Content dist\BUILD_INFO.txt
          "SHA256=$hash" | Add-Content dist\BUILD_INFO.txt
          "Size=$size" | Add-Content dist\BUILD_INFO.txt
          Copy-Item live-aar-v2\*.cs dist\
          Copy-Item live-aar-v2\v21_patch.py dist\

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GHPC_LiveAAR_v2.1.0
          path: dist/**
          if-no-files-found: error
