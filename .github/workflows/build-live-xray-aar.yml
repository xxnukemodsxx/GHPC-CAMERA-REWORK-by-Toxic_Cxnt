name: Build GHPC Live X-Ray AAR

on:
  push:
    branches:
      - live-xray-aar
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: powershell
        run: |
          $b64 = (Get-Content xray-build\payload.txt -Raw).Trim()
          $compressed = [Convert]::FromBase64String($b64)
          $input = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GZipStream($input,[System.IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object System.IO.StreamReader($gzip,[System.Text.Encoding]::UTF8)
          $text = $reader.ReadToEnd()
          $reader.Dispose(); $gzip.Dispose(); $input.Dispose()
          $sep = [char]10 + '//__SPLIT_FILE__' + [char]10
          $parts = $text.Split([string[]]@($sep),2,[System.StringSplitOptions]::None)
          if ($parts.Count -ne 2) { throw 'source split failed' }
          New-Item -ItemType Directory -Force build-src | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'build-src\GHPCLiveAARMod.cs'),$parts[0],(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD 'build-src\LiveXrayAAR.cs'),$parts[1],(New-Object Text.UTF8Encoding($false)))

      - name: Download MelonLoader 0.6.1
        shell: powershell
        run: |
          Invoke-WebRequest 'https://github.com/LavaGang/MelonLoader/releases/download/v0.6.1/MelonLoader.x64.zip' -OutFile melon.zip
          Expand-Archive melon.zip -DestinationPath melon -Force
          $melon = Get-ChildItem melon -Recurse -Filter MelonLoader.dll | Where-Object { $_.FullName -match '[\\/]net35[\\/]' } | Select-Object -First 1
          if (-not $melon) { $melon = Get-ChildItem melon -Recurse -Filter MelonLoader.dll | Select-Object -First 1 }
          if (-not $melon) { throw 'MelonLoader.dll not found' }
          $melon.FullName | Set-Content melon-path.txt

      - name: Compile
        shell: powershell
        run: |
          $melon=(Get-Content melon-path.txt -Raw).Trim()
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc="$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw 'csc.exe not found' }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:library /optimize+ /platform:anycpu /out:dist\GHPC_LiveAAR.dll /reference:"$melon" build-src\GHPCLiveAARMod.cs build-src\LiveXrayAAR.cs
          if ($LASTEXITCODE -ne 0) { throw "compile failed: $LASTEXITCODE" }
          $hash=(Get-FileHash dist\GHPC_LiveAAR.dll -Algorithm SHA256).Hash
          "SHA256=$hash" | Set-Content dist\BUILD_INFO.txt
          "Version=0.2.0" | Add-Content dist\BUILD_INFO.txt
          "Design=Standalone Live X-Ray AAR; Camera Rework untouched" | Add-Content dist\BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GHPC_LiveXrayAAR_0.2.0
          path: dist/*
          if-no-files-found: error
