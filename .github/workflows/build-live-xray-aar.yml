name: Build GHPC Live X-Ray AAR

on:
  push:
    branches:
      - live-xray-v02
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: powershell
        run: |
          $payload = 'live-xray-build\v040_payload.gz'
          if (-not (Test-Path $payload)) { throw "Missing source payload: $payload" }
          $input = [System.IO.File]::OpenRead((Join-Path $PWD $payload))
          $gzip = New-Object System.IO.Compression.GZipStream($input,[System.IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object System.IO.StreamReader($gzip,[System.Text.Encoding]::UTF8)
          $text = $reader.ReadToEnd()
          $reader.Dispose(); $gzip.Dispose(); $input.Dispose()

          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
            $sourceHash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '')
          } finally { $sha.Dispose() }
          if ($sourceHash -ne '5F9E40808B2EDA3F565BCC90A7849577C3D8E5BE0DE8725610916C1ED22DF2D9') {
            throw "Source payload hash mismatch: $sourceHash"
          }

          $sep = [char]10 + '//__SPLIT_FILE__' + [char]10
          $parts = $text.Split([string[]]@($sep),2,[System.StringSplitOptions]::None)
          if ($parts.Count -ne 2) { throw 'Source payload split failed.' }
          New-Item -ItemType Directory -Force build-src | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'build-src\GHPCLiveAARMod.cs'),$parts[0],(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD 'build-src\LiveXrayCore.cs'),$parts[1],(New-Object Text.UTF8Encoding($false)))

      - name: Safety assertions
        shell: powershell
        run: |
          $src = (Get-Content build-src\GHPCLiveAARMod.cs -Raw) + (Get-Content build-src\LiveXrayCore.cs -Raw)
          $forbidden = @(
            'StartAar(',
            'DisplayAarShot(',
            'Time.timeScale',
            'Physics.autoSimulation',
            'Camera.main',
            'Cursor.lockState',
            'Camera_Rework.'
          )
          foreach ($term in $forbidden) {
            if ($src.Contains($term)) { throw "Forbidden live-game takeover API found: $term" }
          }

      - name: Download MelonLoader 0.6.1
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://github.com/LavaGang/MelonLoader/releases/download/v0.6.1/MelonLoader.x64.zip' -OutFile ml.zip
          Expand-Archive ml.zip -DestinationPath ml -Force
          $melon = Get-ChildItem ml -Recurse -Filter MelonLoader.dll | Where-Object { $_.FullName -match '[\\/]net35[\\/]' } | Select-Object -First 1
          if (-not $melon) { $melon = Get-ChildItem ml -Recurse -Filter MelonLoader.dll | Select-Object -First 1 }
          if (-not $melon) { throw 'MelonLoader.dll not found.' }
          $melon.FullName | Set-Content melon-path.txt

      - name: Compile
        shell: powershell
        run: |
          $melon = (Get-Content melon-path.txt -Raw).Trim()
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw 'csc.exe not found.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:library /optimize+ /platform:anycpu /out:dist\GHPC_LiveAAR.dll /reference:"$melon" build-src\GHPCLiveAARMod.cs build-src\LiveXrayCore.cs
          if ($LASTEXITCODE -ne 0) { throw "Compiler failed: $LASTEXITCODE" }
          $hash = (Get-FileHash dist\GHPC_LiveAAR.dll -Algorithm SHA256).Hash
          $size = (Get-Item dist\GHPC_LiveAAR.dll).Length
          "Version=0.4.0" | Set-Content dist\BUILD_INFO.txt
          "AssemblyCSharpTargetSHA256=3321284967EC09971E0FB971ABC5D9B8E881F9EC61CD85EB90C5EDCCD11D8490" | Add-Content dist\BUILD_INFO.txt
          "MelonLoaderCompileTarget=0.6.1 net35" | Add-Content dist\BUILD_INFO.txt
          "SourcePayloadSHA256=5F9E40808B2EDA3F565BCC90A7849577C3D8E5BE0DE8725610916C1ED22DF2D9" | Add-Content dist\BUILD_INFO.txt
          "SHA256=$hash" | Add-Content dist\BUILD_INFO.txt
          "Size=$size" | Add-Content dist\BUILD_INFO.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GHPC_LiveXray_AAR_v0.4.0
          path: |
            dist/GHPC_LiveAAR.dll
            dist/BUILD_INFO.txt
            build-src/GHPCLiveAARMod.cs
            build-src/LiveXrayCore.cs
          if-no-files-found: error
