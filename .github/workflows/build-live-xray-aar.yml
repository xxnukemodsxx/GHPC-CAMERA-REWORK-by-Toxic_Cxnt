name: Build GHPC Live X-Ray AAR

on:
  push:
    branches:
      - live-xray-v02
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: powershell
        run: |
          $payload = 'live-xray-build\v040_payload.gz'
          if (-not (Test-Path $payload)) { throw "Missing source payload: $payload" }
          $input = [System.IO.File]::OpenRead((Join-Path $PWD $payload))
          $gzip = New-Object System.IO.Compression.GZipStream($input,[System.IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object System.IO.StreamReader($gzip,[System.Text.Encoding]::UTF8)
          $text = $reader.ReadToEnd()
          $reader.Dispose(); $gzip.Dispose(); $input.Dispose()

          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
            $sourceHash = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '')
          } finally { $sha.Dispose() }
          if ($sourceHash -ne '5F9E40808B2EDA3F565BCC90A7849577C3D8E5BE0DE8725610916C1ED22DF2D9') {
            throw "Source payload hash mismatch: $sourceHash"
          }

          $sep = [char]10 + '//__SPLIT_FILE__' + [char]10
          $parts = $text.Split([string[]]@($sep),2,[System.StringSplitOptions]::None)
          if ($parts.Count -ne 2) { throw 'Source payload split failed.' }
          New-Item -ItemType Directory -Force build-src | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'build-src\GHPCLiveAARMod.cs'),$parts[0],(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $PWD 'build-src\LiveXrayCore.cs'),$parts[1],(New-Object Text.UTF8Encoding($false)))

      - name: Patch v0.5 X-ray renderer fallback
        shell: powershell
        run: |
          $path = 'build-src\LiveXrayCore.cs'
          $src = Get-Content $path -Raw
          $src = $src.Replace('0.4.0','0.5.0')

          $newClone = @'
        private void CloneVisuals(object sourceRoot, object visualRoot, Dictionary<object, object> tmap, Dictionary<object, object> rmap, Dictionary<object, VisualRule> rules)
        {
            Type rendererType = R.FindType("UnityEngine.Renderer");
            Type meshRendererType = R.FindType("UnityEngine.MeshRenderer");
            Type meshFilterType = R.FindType("UnityEngine.MeshFilter");
            Type skinType = R.FindType("UnityEngine.SkinnedMeshRenderer");
            if (rendererType == null) throw new InvalidOperationException("Unity Renderer type unavailable");

            List<object> renderers = UnityWorld.ComponentsInChildren(R.Get(sourceRoot, "gameObject"), rendererType, true);
            int cloned = 0;
            int aarControlled = 0;
            int fallback = 0;

            for (int i = 0; i < renderers.Count; i++)
            {
                object sr = renderers[i];
                if (sr == null) continue;

                VisualRule vr = null;
                bool ruled = rules != null && rules.TryGetValue(sr, out vr);
                if (ruled && vr != null && vr.Hidden) continue;

                object st = R.Get(sr, "transform");
                object dt;
                if (st == null || !tmap.TryGetValue(st, out dt)) continue;

                string rn = R.Str(sr, "name");
                string low = rn == null ? "" : rn.ToLowerInvariant();
                if (!ruled && (low.Contains("shadow") || low.Contains("decal") || low.Contains("trackmark") || low.Contains("dust") || low.Contains("smoke"))) continue;

                object dgo = R.Get(dt, "gameObject");
                Type actual = sr.GetType();
                object dr = null;

                if (skinType != null && skinType.IsAssignableFrom(actual))
                {
                    dr = UnityWorld.AddComponent(dgo, skinType);
                    R.Set(dr, "sharedMesh", R.Get(sr, "sharedMesh"));
                    R.Set(dr, "localBounds", R.Get(sr, "localBounds"));
                    object sbones = R.Get(sr, "bones");
                    Array ba = sbones as Array;
                    if (ba != null)
                    {
                        Type trType = R.FindType("UnityEngine.Transform");
                        Array db = Array.CreateInstance(trType, ba.Length);
                        for (int b = 0; b < ba.Length; b++)
                        {
                            object dbone;
                            if (tmap.TryGetValue(ba.GetValue(b), out dbone)) db.SetValue(dbone, b);
                        }
                        R.Set(dr, "bones", db);
                    }
                    object sroot = R.Get(sr, "rootBone");
                    object droot;
                    if (sroot != null && tmap.TryGetValue(sroot, out droot)) R.Set(dr, "rootBone", droot);
                    R.Set(dr, "updateWhenOffscreen", true);
                }
                else if (meshRendererType != null && meshRendererType.IsAssignableFrom(actual))
                {
                    object smf = UnityWorld.GetComponent(R.Get(st, "gameObject"), meshFilterType);
                    if (smf != null)
                    {
                        object dmf = UnityWorld.AddComponent(dgo, meshFilterType);
                        R.Set(dmf, "sharedMesh", R.Get(smf, "sharedMesh"));
                    }
                    dr = UnityWorld.AddComponent(dgo, meshRendererType);
                }

                if (dr == null) continue;
                rmap[sr] = dr;

                object mats = R.Get(sr, "sharedMaterials");
                if (ruled && vr != null)
                {
                    aarControlled++;
                    if (vr.SwitchMaterials && vr.Material != null)
                        mats = UnityWorld.MaterialArray(vr.Material, Math.Max(1, UnityWorld.ArrayLength(mats)));
                }
                else
                {
                    fallback++;
                    mats = UnityWorld.MakeXrayMaterials(mats, 0.22f);
                }

                R.Set(dr, "sharedMaterials", mats);
                R.Set(dr, "enabled", true);
                cloned++;
            }

            if (cloned == 0) throw new InvalidOperationException("No target renderers could be cloned");
        }
'@

          $pattern = '(?s)        private void CloneVisuals\(object sourceRoot, object visualRoot, Dictionary<object, object> tmap, Dictionary<object, object> rmap, Dictionary<object, VisualRule> rules\).*?(?=        private void HighlightHitModels)'
          $src = [regex]::Replace($src, $pattern, $newClone + [Environment]::NewLine + [Environment]::NewLine, 1)

          $helper = @'
        internal static object MakeXrayMaterials(object matsObj,float alpha)
        {
            Array src=matsObj as Array;
            if(src==null)return matsObj;
            Array dst=Array.CreateInstance(_material,src.Length);
            for(int i=0;i<src.Length;i++)
            {
                object original=src.GetValue(i);
                object m=CloneMaterial(original);
                if(m==null){dst.SetValue(original,i);continue;}
                SetMaterialColor(m,.58f,.68f,.62f,alpha);
                try
                {
                    R.Call(m,"SetFloat",new object[]{"_Mode",3f});
                    R.Call(m,"SetInt",new object[]{"_SrcBlend",5});
                    R.Call(m,"SetInt",new object[]{"_DstBlend",10});
                    R.Call(m,"SetInt",new object[]{"_ZWrite",0});
                    R.Call(m,"DisableKeyword",new object[]{"_ALPHATEST_ON"});
                    R.Call(m,"EnableKeyword",new object[]{"_ALPHABLEND_ON"});
                    R.Call(m,"DisableKeyword",new object[]{"_ALPHAPREMULTIPLY_ON"});
                    R.Set(m,"renderQueue",3000);
                }
                catch{}
                dst.SetValue(m,i);
            }
            return dst;
        }
'@
          $src = $src.Replace('        internal static void SetMaterialColor', $helper + [Environment]::NewLine + '        internal static void SetMaterialColor')

          [IO.File]::WriteAllText((Join-Path $PWD $path), $src, (New-Object Text.UTF8Encoding($false)))

          $entry = 'build-src\GHPCLiveAARMod.cs'
          $entrySrc = (Get-Content $entry -Raw).Replace('0.4.0','0.5.0')
          [IO.File]::WriteAllText((Join-Path $PWD $entry), $entrySrc, (New-Object Text.UTF8Encoding($false)))

      - name: Safety assertions
        shell: powershell
        run: |
          $src = (Get-Content build-src\GHPCLiveAARMod.cs -Raw) + (Get-Content build-src\LiveXrayCore.cs -Raw)
          $forbidden = @(
            'StartAar(',
            'DisplayAarShot(',
            'Time.timeScale',
            'Physics.autoSimulation',
            'Camera.main',
            'Cursor.lockState',
            'Camera_Rework.'
          )
          foreach ($term in $forbidden) {
            if ($src.Contains($term)) { throw "Forbidden live-game takeover API found: $term" }
          }

      - name: Download MelonLoader 0.6.1
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://github.com/LavaGang/MelonLoader/releases/download/v0.6.1/MelonLoader.x64.zip' -OutFile ml.zip
          Expand-Archive ml.zip -DestinationPath ml -Force
          $melon = Get-ChildItem ml -Recurse -Filter MelonLoader.dll | Where-Object { $_.FullName -match '[\\/]net35[\\/]' } | Select-Object -First 1
          if (-not $melon) { $melon = Get-ChildItem ml -Recurse -Filter MelonLoader.dll | Select-Object -First 1 }
          if (-not $melon) { throw 'MelonLoader.dll not found.' }
          $melon.FullName | Set-Content melon-path.txt

      - name: Compile
        shell: powershell
        run: |
          $melon = (Get-Content melon-path.txt -Raw).Trim()
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          if (-not (Test-Path $csc)) { throw 'csc.exe not found.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $csc /nologo /target:library /optimize+ /platform:anycpu /out:dist\GHPC_LiveAAR.dll /reference:"$melon" build-src\GHPCLiveAARMod.cs build-src\LiveXrayCore.cs
          if ($LASTEXITCODE -ne 0) { throw "Compiler failed: $LASTEXITCODE" }
          $hash = (Get-FileHash dist\GHPC_LiveAAR.dll -Algorithm SHA256).Hash
          $size = (Get-Item dist\GHPC_LiveAAR.dll).Length
          "Version=0.5.0" | Set-Content dist\BUILD_INFO.txt
          "AssemblyCSharpTargetSHA256=3321284967EC09971E0FB971ABC5D9B8E881F9EC61CD85EB90C5EDCCD11D8490" | Add-Content dist\BUILD_INFO.txt
          "MelonLoaderCompileTarget=0.6.1 net35" | Add-Content dist\BUILD_INFO.txt
          "SourcePayloadSHA256=5F9E40808B2EDA3F565BCC90A7849577C3D8E5BE0DE8725610916C1ED22DF2D9" | Add-Content dist\BUILD_INFO.txt
          "SHA256=$hash" | Add-Content dist\BUILD_INFO.txt
          "Size=$size" | Add-Content dist\BUILD_INFO.txt
          Copy-Item build-src\GHPCLiveAARMod.cs dist\GHPCLiveAARMod.cs
          Copy-Item build-src\LiveXrayCore.cs dist\LiveXrayCore.cs

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GHPC_LiveXray_AAR_v0.5.0
          path: dist/**
          if-no-files-found: error
