name: Build Standalone GHPC Live AAR

on:
  push:
    branches:
      - standalone-aar
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct standalone source
        shell: powershell
        run: |
          $b64 = (Get-Content standalone-build\payload_00.txt -Raw).Trim() + (Get-Content standalone-build\payload_01.txt -Raw).Trim()
          $compressed = [Convert]::FromBase64String($b64)
          $input = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GZipStream($input, [System.IO.Compression.CompressionMode]::Decompress)
          $reader = New-Object System.IO.StreamReader($gzip, [System.Text.Encoding]::UTF8)
          $text = $reader.ReadToEnd()
          $reader.Dispose()
          $gzip.Dispose()
          $input.Dispose()

          $separator = [Environment]::NewLine + '//__SPLIT_FILE__' + [Environment]::NewLine
          if (-not $text.Contains($separator)) {
            $separator = [char]10 + '//__SPLIT_FILE__' + [char]10
          }
          $parts = $text.Split([string[]]@($separator), 2, [System.StringSplitOptions]::None)
          if ($parts.Count -ne 2) { throw 'Could not split reconstructed source payload.' }

          New-Item -ItemType Directory -Force build-src | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build-src\GHPCLiveAARMod.cs'), $parts[0], (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::WriteAllText((Join-Path $PWD 'build-src\LiveAarCore.cs'), $parts[1], (New-Object System.Text.UTF8Encoding($false)))

          Write-Host 'Entry source bytes:' (Get-Item build-src\GHPCLiveAARMod.cs).Length
          Write-Host 'Core source bytes:' (Get-Item build-src\LiveAarCore.cs).Length

      - name: Download matching MelonLoader 0.6.1
        shell: powershell
        run: |
          $url = 'https://github.com/LavaGang/MelonLoader/releases/download/v0.6.1/MelonLoader.x64.zip'
          Invoke-WebRequest -Uri $url -OutFile MelonLoader.x64.zip
          Expand-Archive MelonLoader.x64.zip -DestinationPath melon -Force
          $melon = Get-ChildItem melon -Recurse -Filter MelonLoader.dll | Where-Object { $_.FullName -match '[\\/]net35[\\/]' } | Select-Object -First 1
          if (-not $melon) { $melon = Get-ChildItem melon -Recurse -Filter MelonLoader.dll | Select-Object -First 1 }
          if (-not $melon) { throw 'MelonLoader.dll not found in the v0.6.1 archive.' }
          $melon.FullName | Set-Content melon-path.txt
          Write-Host 'Using MelonLoader reference:' $melon.FullName

      - name: Compile GHPC_LiveAAR.dll
        shell: powershell
        run: |
          $melon = (Get-Content melon-path.txt -Raw).Trim()
          $cscCandidates = @("$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe", "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe")
          $csc = $cscCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $csc) { throw 'csc.exe not found on runner.' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $args = @('/nologo','/target:library','/optimize+','/platform:anycpu',"/out:dist\GHPC_LiveAAR.dll","/reference:$melon",'build-src\GHPCLiveAARMod.cs','build-src\LiveAarCore.cs')
          & $csc $args
          if ($LASTEXITCODE -ne 0) { throw "C# compiler failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist\GHPC_LiveAAR.dll)) { throw 'DLL was not produced.' }
          $hash = (Get-FileHash dist\GHPC_LiveAAR.dll -Algorithm SHA256).Hash
          $size = (Get-Item dist\GHPC_LiveAAR.dll).Length
          "SHA256=$hash" | Set-Content dist\BUILD_INFO.txt
          "Size=$size" | Add-Content dist\BUILD_INFO.txt
          "MelonLoaderCompileTarget=0.6.1 net35" | Add-Content dist\BUILD_INFO.txt
          Write-Host "Built dist\GHPC_LiveAAR.dll ($size bytes)"
          Write-Host "SHA256 $hash"

      - name: Upload standalone DLL
        uses: actions/upload-artifact@v4
        with:
          name: GHPC_LiveAAR_Standalone
          path: |
            dist/GHPC_LiveAAR.dll
            dist/BUILD_INFO.txt
          if-no-files-found: error
